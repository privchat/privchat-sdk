name: restart-fault-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  restart-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [restart, dead-recovery]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: privchat_fault_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d privchat_fault_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PRIVCHAT_FAULT_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/privchat_fault_ci
      PRIVCHAT_FAULT_REDIS_URL: redis://127.0.0.1:6379
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          path: privchat-sdk
      - uses: actions/checkout@v4
        with:
          repository: privchat/privchat
          ref: f2520c4af066bef75df14be32a28f23ed03ff98d
          path: privchat-server
      - uses: actions/checkout@v4
        with:
          repository: zoujiaqing/msgtrans
          ref: 2c3086dc3b12da75aa20f0fbec448620b9a126e9
          path: msgtrans
      - uses: actions/checkout@v4
        with:
          repository: privchat/privchat-protocol
          ref: c5cbe557090deeb8b9f41d53ff0414ce949bb8ef
          path: privchat-protocol
      - uses: actions/checkout@v4
        with:
          repository: google/flatbuffers
          ref: v25.12.19-2026-02-06-03fffb2
          path: flatbuffers
      - name: Build pinned FlatBuffers compiler
        run: |
          cmake -S "$GITHUB_WORKSPACE/flatbuffers" -B "$RUNNER_TEMP/flatc-build" -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/flatc-build" --target flatc --parallel 2
          echo "$RUNNER_TEMP/flatc-build" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            privchat-server
            privchat-sdk
      - name: Install database client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools jq
      - name: Build server with online SQLx schema
        run: |
          psql "$PRIVCHAT_FAULT_DB_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE privchat_fault_compile;'
          compile_db="${PRIVCHAT_FAULT_DB_URL%/*}/privchat_fault_compile"
          for schema in migrations/00[1-9]*.sql; do
            psql "$compile_db" -v ON_ERROR_STOP=1 -f "$schema"
          done
          DATABASE_URL="$compile_db" cargo build --bin privchat
        working-directory: privchat-server
      - name: Check network TLS dependencies
        working-directory: privchat-sdk
        run: |
          tree=$(cargo tree -p privchat-sdk --edges normal,build --prefix none --format '{p}')
          # Non-Apple SQLCipher deliberately includes openssl-sys/libcrypto, not native TLS.
          if grep -E '^(openssl|native-tls|hyper-tls|tokio-native-tls) v' <<< "$tree"; then
            echo "SDK network TLS must use rustls."
            exit 1
          fi
      - name: Build two-client harness
        run: cargo build -p privchat-sdk --example accounts
        working-directory: privchat-sdk
      - name: Install pinned monitoring tools in the runner temp folder
        if: matrix.mode == 'dead-recovery'
        run: |
          cd "$RUNNER_TEMP"
          fetch() {
            local repo=$1 version=$2 checksum=$3 archive
            archive="$repo-$version.linux-amd64.tar.gz"
            curl --fail --silent --show-error --location --retry 2 --max-time 120 \
              "https://github.com/prometheus/$repo/releases/download/v$version/$archive" -o "$archive"
            echo "$checksum  $archive" | sha256sum -c -
            tar -xzf "$archive"
          }
          fetch prometheus 3.16.0 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
          fetch alertmanager 0.35.0 6c7752a903c40c8a749e0b29df9240437e4fbb8228068d0af8807377db32addd
          echo "PRIVCHAT_PROMETHEUS_BIN=$RUNNER_TEMP/prometheus-3.16.0.linux-amd64/prometheus" >>"$GITHUB_ENV"
          echo "PRIVCHAT_ALERTMANAGER_BIN=$RUNNER_TEMP/alertmanager-0.35.0.linux-amd64/alertmanager" >>"$GITHUB_ENV"
      - name: Run isolated acceptance gate
        env:
          PRIVCHAT_GATE_MODE: ${{ matrix.mode }}
        run: |
          export PRIVCHAT_DISPATCH_RULES="$GITHUB_WORKSPACE/privchat-server/deploy/prometheus/timeline-dispatch.rules.yml"
          bash privchat-sdk/scripts/restart-fault-gate.sh privchat-server/target/debug/privchat privchat-sdk/target/debug/examples/accounts
