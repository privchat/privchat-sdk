[package]
name = "capi_full"
version = "0.1.0"
edition = "2021"
authors = ["PrivChat Team"]
description = "PrivChat SDK C ABI full-flow example (two accounts, direct chat, room subscription)"

[workspace]

[[bin]]
name = "capi_full"
path = "main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

# build.rs builds privchat-sdk-c-api and links the cdylib: this example
# consumes the C ABI exactly like a C/C++ host would (no Rust-internal path).
