[package]
name = "accounts"
version = "0.1.0"
edition = "2021"
authors = ["PrivChat Team"]
description = "PrivChat SDK multi-account example"

[workspace]

[[bin]]
name = "accounts"
path = "main.rs"

[dependencies]
privchat-sdk = { path = "../.." }
privchat-protocol = { path = "../../../../../privchat-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# The attachment phases send a REAL image and assert on what comes back, so the
# harness has to be able to produce one. It is a direct dependency: privchat-sdk
# happening to use `image` internally does not make it nameable here.
image = { version = "0.25", default-features = false, features = ["png"] }
